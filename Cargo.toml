edition = "2021"
description = "在终端窗口内播放 Claude FM 直播（mpv kitty/tct 渲染）。"
repository = "https://github.com/sefuzhou770801-hub/claude-fm-tui"
homepage = "https://github.com/sefuzhou770801-hub/claude-fm-tui"
